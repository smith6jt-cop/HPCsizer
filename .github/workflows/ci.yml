name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check . bin/hpg
      - name: Ruff format check
        run: ruff format --check . bin/hpg
      - name: Shell syntax
        run: bash -n bin/harvest.sh

  # HPCsizer has no third-party dependencies: the suite runs with pytest alone,
  # on every Python version a cluster is likely to offer.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Nothing else is importable
        run: |
          python - <<'PY'
          import importlib.util, sys
          extra = [m for m in ("click", "numpy", "scipy", "pandas", "matplotlib") if importlib.util.find_spec(m)]
          sys.exit("unexpected packages: %s" % extra if extra else 0)
          PY
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
      - name: Command line starts
        run: |
          bin/hpg --version
          HPCSIZER_ROOT="$RUNNER_TEMP/empty" bin/hpg status --no-sacct || test $? -eq 1

  # The one optional dependency: matplotlib, for `hpg plot`.
  plot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest matplotlib
      - name: Plot tests run instead of being skipped
        run: |
          python -m pytest tests/test_plotter.py -v --tb=short -rs | tee plot.log
          ! grep -q SKIPPED plot.log
