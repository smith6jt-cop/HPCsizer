# Optional. HPCsizer itself needs nothing but Python 3.9+ and its standard
# library; it runs with the system python3. This environment adds what the two
# optional parts need: matplotlib for `hpg plot`, pytest and ruff for development.
#
#   conda env create -f environment.yml
#   conda activate hpcsizer
name: hpcsizer
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - matplotlib>=3.4
  - pytest>=7.0
  - ruff>=0.4
